name: Cloud deploy

# DocketClock on Cloudflare + Neon (infra/cloudflare). MANUAL ONLY: nothing deploys on push or merge.
# Run it from the Actions tab → "Cloud deploy" → Run workflow, and pick `plan` (preview, changes nothing)
# or `deploy`.
#
# Repo secrets: CLOUDFLARE_API_TOKEN, NEON_API_KEY, REGS_API_KEY, GEMINI_API_KEY, DOCKETCLOCK_API_KEYS.
# Repo variables: CLOUDFLARE_ACCOUNT_ID (required); DOCKETCLOCK_POLL_CRON (optional; unset = cron OFF);
# DOCKETCLOCK_API_DOMAIN (optional; unset = workers.dev).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan = preview only; deploy = apply"
        type: choice
        options: [plan, deploy]
        default: plan

# Never run two applies against the same stack at once.
concurrency:
  group: cloud-deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alchemy:
    runs-on: ubuntu-latest # has Docker, which builds the container image
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      REGS_API_KEY: ${{ secrets.REGS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DOCKETCLOCK_API_KEYS: ${{ secrets.DOCKETCLOCK_API_KEYS }}
      DOCKETCLOCK_POLL_CRON: ${{ vars.DOCKETCLOCK_POLL_CRON }}
      DOCKETCLOCK_API_DOMAIN: ${{ vars.DOCKETCLOCK_API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yokel/docketclock-cloud...
      - name: alchemy ${{ inputs.action }}
        working-directory: infra/cloudflare
        run: pnpm exec alchemy ${{ inputs.action }} --stage prod --no-input
