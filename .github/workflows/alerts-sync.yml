name: Alerts sync

# Applies the cloud alert checks (apps/docketclock/src/alerts/checks.ts) to healthchecks.io, so check
# periods, grace times and descriptions live in git. Runs when checks.ts changes on main, or by hand.
#
# Repo secret: HEALTHCHECKS_API_KEY (the healthchecks.io project's read-write API key). Until it is set,
# the job says so and succeeds without doing anything.
on:
  push:
    branches: [main]
    paths:
      - apps/docketclock/src/alerts/checks.ts
      - apps/docketclock/scripts/sync-healthchecks.ts
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would change without changing it"
        type: boolean
        default: false

concurrency:
  group: alerts-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
    steps:
      - name: secret check
        id: gate
        run: |
          if [ -z "$HEALTHCHECKS_API_KEY" ]; then
            echo "::notice::HEALTHCHECKS_API_KEY is not set; nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @yokel/docketclock...
        if: steps.gate.outputs.skip != 'true'
      - name: sync checks
        if: steps.gate.outputs.skip != 'true'
        working-directory: apps/docketclock
        run: pnpm exec tsx scripts/sync-healthchecks.ts ${{ inputs.dry_run && '--dry-run' || '' }}
